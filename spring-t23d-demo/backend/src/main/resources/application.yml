server:
  port: 8080

app:
  llm:
    provider: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o
      base-url: https://api.openai.com/v1
  freecad:
    docker-image: text-to-3d-freecad:latest
    timeout-seconds: 30
    memory-limit: 512m
    cpu-limit: "1"
    scripts-dir: ${java.io.tmpdir}/text-to-3d/scripts
    # Nur noetig, wenn das Backend selbst containerisiert laeuft (siehe docker-compose.yml):
    # Host-Pfad des gemounteten Skript-Ordners, den der Docker-Daemon fuer "docker run -v" braucht.
    # Wird dort per APP_FREECAD_SCRIPTSDIRHOST gesetzt; lokal/nativ bleibt dieser Wert leer.
    scripts-dir-host: ""
    models-dir: ./data/models

logging:
  level:
    de.scc.demo.t23d: DEBUG
